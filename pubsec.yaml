workflows:
  android-release:
    name: Android Release Build
    max_build_duration: 120
    instance_type: mac_mini  # <- CHANGED THIS
    environment:
      flutter: stable
    scripts:
      - name: Install dependencies
        script: |
          flutter pub get
      - name: Flutter analyze
        script: |
          flutter analyze
      - name: Build APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
