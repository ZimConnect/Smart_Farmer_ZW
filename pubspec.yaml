name: smart_farmer_zw
description: "Zimbabwe-focused Android Flutter app for livestock, crops, and farm finance"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  drift: ^2.18.2
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0
  uuid: ^4.4.2
  table_calendar: ^3.1.2
  syncfusion_flutter_charts: ^27.2.2
  syncfusion_flutter_core: ^27.2.2
  csv: ^6.0.0
  pdf: ^3.11.3
  printing: ^5.12.0
  flutter_local_notifications: ^18.0.1
  in_app_purchase: ^3.1.14 # NEW FOR PRO

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.3 # ADDED THIS

dependency_overrides:
  sqlite3: ^2.2.0
  sqlite3_flutter_libs: ^0.5.24

flutter:
  uses-material-design: true
  assets:
    - assets/images/

# APP ICON CONFIG - THIS WAS MISSING
flutter_launcher_icons:
  android: "flutter_launcher_icons"
  ios: true
  image_path: "logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
