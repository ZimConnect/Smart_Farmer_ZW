name: smart_farmer_zw
description: "Zimbabwe-focused Android Flutter app for livestock, crops, and farm finance"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.3
  drift: ^2.18.2
  drift_sqflite: ^2.4.2
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  intl: ^0.19.0
  table_calendar: ^3.1.2
  syncfusion_flutter_charts: ^27.2.2
  syncfusion_flutter_core: ^27.2.2
  csv: ^5.1.1
  pdf: ^3.11.3
  printing: ^5.13.4
  flutter_local_notifications: ^18.0.1
  in_app_purchase: ^3.1.14  # NEW FOR PRO

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.18.2
  build_runner: ^2.4.13

dependency_overrides:
  sqlite3: ^2.4.2
  sqlite3_flutter_libs: ^0.5.24  # CRITICAL FOR WEB

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
