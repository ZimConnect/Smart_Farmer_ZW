name: smart_farmer_zw
description: Smart Farmer ZW Pro - Complete Farm Management for Zimbabwe
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'


dependencies:
  flutter:
    sdk: flutter
  
  # Core - pinned versions that work
  drift: ^2.18.2
  drift_sqflite: ^2.4.2
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_riverpod: ^2.5.1
  intl: ^0.19.0
  uuid: ^4.4.2

  # PRO Features
  in_app_purchase: ^3.1.14
  flutter_secure_storage: ^9.2.4
  flutter_local_notifications: ^17.2.3
  pdf: ^3.11.1
  csv: ^5.1.1
  syncfusion_flutter_charts: ^27.1.53
  file_picker: ^8.1.5

  # UI
  flutter_material_pickers: ^3.0.2
  table_calendar: ^3.1.3

dependency_overrides:

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
