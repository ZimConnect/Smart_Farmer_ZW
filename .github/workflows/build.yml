name: Build Smart Farmer APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

defaults:
  run:
    working-directory: .  # <-- FORCE ALL COMMANDS TO RUN IN ROOT

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: List files - DEBUG
      run: ls -la  # <-- This will show us if pubspec.yaml is really there
      
    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
      
    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build APK Release
      run: flutter build apk --release
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Smart-Farmer-ZW-v1.0.apk
        path: build/app/outputs/flutter-apk/app-release.apk
